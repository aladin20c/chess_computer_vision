<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess Board</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">Drag to rotate | Scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Basic Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        
        // Camera - simple angled view
        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(10, 12, 10);
        camera.lookAt(0, 0, 0);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // Board colors
        const lightColor = 0x5a76a4;
        const darkColor = 0x435775;
        
        // Board data
        const boardSize = 8;
        const tileSize = 1;
        const boardFilling = [[true, true, true, false, true, true, true, true], [true, true, true, false, true, true, true, true], [true, true, true, false, true, true, true, true], [true, true, true, false, true, true, true, true], [true, true, true, false, true, true, true, true], [true, true, true, false, true, true, true, true], [true, true, true, false, true, true, true, true], [true, true, true, false, true, true, true, true]];
        
        // Create board
        const boardGroup = new THREE.Group();
        
        let idx = 0;
        for (let row = 0; row < boardSize; row++) {
            for (let col = 0; col < boardSize; col++) {
                // Checkerboard pattern
                const isLight = (row + col) % 2 === 0;
                const color = isLight ? lightColor : darkColor;
                
                // Create tile
                const geometry = new THREE.BoxGeometry(tileSize, 0.2, tileSize);
                const material = new THREE.MeshStandardMaterial({ 
                    color: color,
                    roughness: 0.7,
                    metalness: 0.1
                });
                const tile = new THREE.Mesh(geometry, material);
                
                // Position (center the board)
                const x = col - boardSize/2 + 0.5;
                const z = row - boardSize/2 + 0.5;
                tile.position.set(x, 0, z);
                tile.receiveShadow = true;
                tile.castShadow = true;
                
                boardGroup.add(tile);
                
                // Add piece if occupied
                if (!boardFilling[idx]) {
                    const pieceGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16);
                    const pieceMaterial = new THREE.MeshStandardMaterial({ 
                        color: 0x444444,
                        roughness: 0.5,
                        metalness: 0.4
                    });
                    const piece = new THREE.Mesh(pieceGeometry, pieceMaterial);
                    piece.position.set(x, 0.6, z);
                    piece.castShadow = true;
                    boardGroup.add(piece);
                }
                
                idx++;
            }
        }
        
        scene.add(boardGroup);
        
        // Floor plane
        const floorGeometry = new THREE.PlaneGeometry(30, 30);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a1a,
            roughness: 0.9
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Simple mouse controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        
        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                boardGroup.rotation.y += deltaX * 0.01;
                boardGroup.rotation.x += deltaY * 0.01;
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });
        
        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(5, Math.min(30, camera.position.z));
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
